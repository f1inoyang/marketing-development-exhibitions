name: Refresh and publish exhibition calendar
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']

permissions:
  contents: read

concurrency:
  group: exhibition-calendar-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collection and publication rules
        run: python3 -m unittest discover -v
      - name: Read configured official sources
        run: python3 collector.py --config sources.json --timeout 8 --output-dir collection-run
      - name: Reconcile and build the bilingual release
        run: python3 refresh.py --input collection-run
      - name: Save source outcomes, evidence and publication decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: collection-run/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Stage public files
        run: |
          mkdir release
          cp index.html events-en.csv events-zh.csv exhibition-source.zip release/
      - uses: actions/upload-artifact@v4
        with:
          name: exhibition-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
      url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exhibition-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Commit the complete release
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin refs/heads/main | cut -f1 | grep -Fxq "$GITHUB_SHA"; then
            echo "The branch changed during collection. Run again against the new source state." >&2
            exit 1
          fi
          for f in index.html events-en.csv events-zh.csv exhibition-source.zip; do
            cp -- "release/$f" "$f"
            git add -- "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified exhibition calendar'
            git push origin HEAD:main
          fi
      - name: Read Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '"mode=" + .build_type, "url=" + .html_url' >> "$GITHUB_OUTPUT"
      - name: Request a rebuild from the published branch
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: release/
      - name: Check configured Pages mode
        env:
          MODE: ${{ steps.pages.outputs.mode }}
        run: test "$MODE" = legacy || test "$MODE" = workflow

  deploy:
    if: needs.publish.outputs.mode == 'workflow'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: always() && needs.publish.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exhibition-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Compare the public page and downloads with the release
        env:
          PAGES_URL: ${{ needs.publish.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in {1..35}; do
            match=true
            for f in index.html events-zh.csv events-en.csv exhibition-source.zip; do
              if ! curl --fail --silent --show-error --location --max-time 20 "${PAGES_URL%/}/$f?release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" -o live-file || ! cmp -s "release/$f" live-file; then
                match=false
                break
              fi
            done
            if "$match"; then exit 0; fi
            sleep 15
          done
          echo "The public site differs from the generated release." >&2
          exit 1
