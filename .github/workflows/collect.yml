name: Monitor official exhibition sources
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhibition-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python3 -m unittest test_collector
      - name: Collect candidates for review
        run: python3 collector.py --config sources.json --timeout 8 --output-dir collection-run
      - name: Save review bundle
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-review-${{ github.run_id }}
          path: collection-run/*.json
          retention-days: 30
